spring:
  application:
    name: ledger
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger
    username: ledger
    password: ledger
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      use-big-decimal-for-floats: true
  mvc:
    problemdetails:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

ledger:
  reconciliation:
    # The month-end job (DESIGN.md §12.4), at 00:06 UTC on the 1st unless ledger.reconciliation.cron says otherwise.
    # Off in tests.
    scheduling-enabled: true
