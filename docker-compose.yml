# Local PostgreSQL for running the app. Keep the image tag in sync with
# IntegrationTestBase.POSTGRES_IMAGE (DESIGN.md §2).
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ledger-data:
